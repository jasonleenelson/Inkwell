name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-gtksource-5
      - name: Unit tests
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Check the app imports
        run: /usr/bin/python3 -c "import inkwell.main"
